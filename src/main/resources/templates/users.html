<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{users.title}">Users Management - Nodify Newsletter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/users.css">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-users"></i> <span th:text="#{users.title}">Users Management</span></h1>
            <p th:text="#{users.subtitle}">Manage your newsletter subscribers</p>
        </div>

        <div class="actions-bar">
            <button class="btn-primary" onclick="openUserModal()"><i class="fas fa-plus"></i> <span th:text="#{users.add_user}">Add User</span></button>
            <button class="btn-secondary" onclick="exportUsers()"><i class="fas fa-download"></i> <span th:text="#{users.export}">Export JSON</span></button>
            <label class="btn-secondary" for="importFile"><i class="fas fa-upload"></i> <span th:text="#{users.import}">Import JSON</span></label>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importUsers(this)">
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" th:placeholder="#{users.search_placeholder}">
            <button onclick="searchUsers()"><i class="fas fa-search"></i> <span th:text="#{users.search}">Search</span></button>
        </div>

        <div class="users-table-container">
            <table class="users-table">
                <thead>
                    <tr>
                        <th th:text="#{users.id}">ID</th>
                        <th th:text="#{users.email}">Email</th>
                        <th th:text="#{users.first_name}">First Name</th>
                        <th th:text="#{users.last_name}">Last Name</th>
                        <th th:text="#{users.phone}">Phone</th>
                        <th th:text="#{users.address}">Address</th>
                        <th th:text="#{users.created}">Created</th>
                        <th th:text="#{users.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="8" class="loading" th:text="#{users.loading}">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" th:text="#{users.add_user_title}">Add User</h3>
            <input type="hidden" id="userId">
            <input type="email" id="userEmail" th:placeholder="#{users.email}" required>
            <input type="text" id="userFirstName" th:placeholder="#{users.first_name}">
            <input type="text" id="userLastName" th:placeholder="#{users.last_name}">
            <input type="text" id="userPhone" th:placeholder="#{users.phone}">
            <input type="text" id="userAddress" th:placeholder="#{users.address}">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeUserModal()" th:text="#{common.cancel}">Cancel</button>
                <button class="btn-save" onclick="saveUser()" th:text="#{common.save}">Save</button>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.currentPage = 'users';
        /*]]>*/
    </script>
    <script src="/js/users.js"></script>
</body>

</html>
