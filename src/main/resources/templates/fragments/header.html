<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="common-head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        .header-container {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 8px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .logo {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1;
        }

        .lang-switch {
            display: flex;
            gap: 8px;
        }

        .lang-switch a {
            text-decoration: none;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div th:fragment="header">
        <div class="header-container">
            <img src="/images/logo.png" alt="Nodify" class="logo" th:src="@{/images/logo.png}">

            <div class="nav-links">
                <a href="/" class="nav-link" th:classappend="${currentPage == 'dashboard' ? 'active' : ''}">
                    <i class="fas fa-tachometer-alt"></i> <span th:text="#{dashboard.title}">Dashboard</span>
                </a>
                <a href="/campaigns" class="nav-link" th:classappend="${currentPage == 'campaigns' ? 'active' : ''}">
                    <i class="fas fa-list"></i> <span th:text="#{campaigns.title}">Campaigns</span>
                </a>
                <a href="/newsletters" class="nav-link"
                    th:classappend="${currentPage == 'newsletters' ? 'active' : ''}">
                    <i class="fas fa-newspaper"></i> <span th:text="#{newsletters.title}">Newsletters</span>
                </a>
                <a href="/users" class="nav-link" th:classappend="${currentPage == 'users' ? 'active' : ''}">
                    <i class="fas fa-users"></i> <span th:text="#{dashboard.users}">Users</span>
                </a>
            </div>

            <div class="lang-switch">
                <a href="?lang=fr">🇫🇷</a>
                <a href="?lang=en">🇬🇧</a>
                <a href="?lang=es">🇪🇸</a>
                <a href="?lang=de">🇩🇪</a>
                <a href="?lang=pt">🇵🇹</a>
            </div>
        </div>

           <script th:inline="javascript">
            /*<![CDATA[*/
            window.i18n = {
                'status.completed':        /*[[#{status.completed}]]*/       'Completed',
                'status.sending':          /*[[#{status.sending}]]*/         'Sending',

                'status.expired':          /*[[#{status.expired}]]*/         'Expired',

                'status.inactive':         /*[[#{status.inactive}]]*/        'Inactive',
                'status.draft':            /*[[#{status.draft}]]*/           'Draft',
                'status.failed':           /*[[#{status.failed}]]*/          'Failed',
                'status.paused':           /*[[#{status.paused}]]*/          'Paused',

                'campaign.rate':           /*[[#{campaign.rate}]]*/          'Rate',
                'campaign.status_open':    /*[[#{campaign.status_open}]]*/   'Opened',
                'campaign.status_not_open':/*[[#{campaign.status_not_open}]]*/ 'Not opened',
                'campaign.no_current':     /*[[#{campaign.no_current}]]*/    'No users in this campaign',
                'campaign.no_available':   /*[[#{campaign.no_available}]]*/  'No available users',
                'campaign.remove_confirm': /*[[#{campaign.remove_confirm}]]*/ 'Remove this user from the campaign?',
                'campaign.retry_confirm':  /*[[#{campaign.retry_confirm}]]*/ 'Retry sending?',
                'campaign.retry_success':  /*[[#{campaign.retry_success}]]*/ 'Retry started',
                'campaign.retry_error':    /*[[#{campaign.retry_error}]]*/   'Error starting retry',
                'campaign.import_success': /*[[#{campaign.import_success}]]*/ 'Users imported successfully',
                'campaign.import_error':   /*[[#{campaign.import_error}]]*/  'Invalid JSON format',
                'campaign.view_newsletter':/*[[#{campaign.view_newsletter}]]*/ 'View Newsletter',

                'newsletters.code_required':/*[[#{newsletters.code_required}]]*/ 'Code is required',
                'newsletters.title_required':/*[[#{newsletters.title_required}]]*/ 'Title is required',
                'dashboard.empty_campaigns':/*[[#{dashboard.empty_campaigns}]]*/ 'No campaigns',
                'dashboard.empty_users':   /*[[#{dashboard.empty_users}]]*/  'No users',
                'dashboard.scheduled':     /*[[#{campaigns.scheduled}]]*/    'Scheduled',
                'dashboard.start':         /*[[#{campaign.start_date}]]*/    'Start',
                'dashboard.end':           /*[[#{campaign.end_date}]]*/      'End',
                'users.no_users':          /*[[#{users.no_users}]]*/         'No users found',
                'users.add_user_title':    /*[[#{users.add_user_title}]]*/   'Add User',
                'users.edit_user':         /*[[#{users.edit_user}]]*/        'Edit User',
                'users.error_saving':      /*[[#{users.error_saving}]]*/     'Error saving user',
                'users.delete_confirm':    /*[[#{users.delete_confirm}]]*/   'Delete this user?',
                'users.import_success':    /*[[#{users.import_success}]]*/   'Users imported',
                'users.import_error':      /*[[#{users.import_error}]]*/     'Invalid JSON file',
                'users.email_required':    /*[[#{users.email_required}]]*/   'Email is required',
                'schedule.error':          /*[[#{schedule.error}]]*/         'Error saving schedule',
                'common.error':            /*[[#{common.error}]]*/           'Error',
                'common.loading':          /*[[#{common.loading}]]*/         'Loading...',
                'common.details':          /*[[#{common.details}]]*/         'Details',
                'common.delete':           /*[[#{common.delete}]]*/          'Delete',
                'common.schedule':         /*[[#{common.schedule}]]*/        'Schedule',
                'common.add':              /*[[#{common.add}]]*/             'Add',
                'common.remove':           /*[[#{common.remove}]]*/          'Remove',
                'common.edit':             /*[[#{common.edit}]]*/            'Edit',
                'common.cancel':           /*[[#{common.cancel}]]*/          'Cancel',
                'common.close':            /*[[#{common.close}]]*/           'Close',
                'empty.no_campaigns':      /*[[#{empty.no_campaigns}]]*/     'No campaigns',
                'campaigns.create_error':  /*[[#{campaigns.create_error}]]*/ 'Please fill required fields',
                'campaigns.newsletter_placeholder': /*[[#{campaigns.newsletter_placeholder}]]*/ '-- Select Newsletter --'
            };

            window.t = function (key, fallback) {
                return (window.i18n && window.i18n[key]) || fallback || key;
            };
            /*]]>*/
        </script>
    </div>
</body>

</html>
